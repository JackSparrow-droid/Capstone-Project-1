<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Foodify Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>

body{

background:#f5f5f5;
font-family:Poppins,sans-serif;

}

.login-box{

width:420px;
margin:70px auto;
background:#fff;
padding:40px;
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,.1);

}

.logo{

font-size:40px;
text-align:center;

}

h2{

text-align:center;
font-weight:bold;
margin-bottom:25px;

}

.form-control{

height:50px;

}

.btn-danger{

height:50px;
font-size:18px;

}

a{

text-decoration:none;

}

</style>

</head>

<body>

<div class="login-box">

<div class="logo">
🍔
</div>

<h2>Foodify Login</h2>

<form action="customer-dashboard.html">

<div class="mb-3">

<label>Email</label>

<input
type="email"
class="form-control"
placeholder="Enter Email"
required>

</div>

<div class="mb-3">

<label>Password</label>

<div class="input-group">

<input
type="password"
id="password"
class="form-control"
placeholder="Enter Password"
required>

<button
class="btn btn-outline-secondary"
type="button"
onclick="showPassword()">

<i class="bi bi-eye"></i>

</button>

</div>

</div>

<div class="d-flex justify-content-between mb-3">

<div>

<input type="checkbox">

Remember Me

</div>

<a href="#">

Forgot Password?

</a>

</div>

<button class="btn btn-danger w-100">

Login

</button>

<div class="text-center mt-3">

Don't have an account?

<a href="register.html">

Register

</a>

</div>

<div class="text-center mt-3">

<a href="index.html">

← Back to Home

</a>

</div>

</form>

</div>

<script>

function showPassword(){

let x=document.getElementById("password");

if(x.type==="password"){

x.type="text";

}

else{

x.type="password";

}

}

</script>

</body>

</html>
